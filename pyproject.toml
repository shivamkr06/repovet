[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repovet-cli"
version = "0.1.0"
description = "Vet a GitHub repo for fake stars, abandonment, risky install scripts and typosquatting. Radar for new repos in your stack."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repovet contributors" }]
keywords = [
  "github", "fake-stars", "supply-chain-security", "typosquatting", "repository-analysis",
  "trust-score", "dependency-vetting", "trending-repositories", "cli", "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shivamkr06/repovet"
Issues = "https://github.com/shivamkr06/repovet/issues"
Changelog = "https://github.com/shivamkr06/repovet/blob/main/CHANGELOG.md"

[project.scripts]
repovet = "repovet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
